name: Release

# Builds distributable plugins and attaches them to a GitHub release.
# Trigger by pushing a bare SemVer tag (e.g. `git tag 0.1.0 && git push origin 0.1.0`),
# or run manually to produce a pre-release from any ref.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            preset: release-macos
          - os: ubuntu-latest
            name: Linux
            preset: release
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxi-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: Install pinned tools (cmake, ninja)
        uses: jdx/mise-action@v2

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          BUNDLE=build/release/src/plugin/OpenPedal_artefacts/Release/VST3/OpenPedal.vst3
          CLI=build/release/src/cli/open-pedal-render_artefacts/Release/open-pedal-render
          lipo -info "$BUNDLE/Contents/MacOS/OpenPedal"
          # Ad-hoc signature so Apple Silicon Macs will load the unsigned bundle after the
          # quarantine flag is removed. A Developer ID signature + notarization replaces this later.
          codesign --force --deep --sign - "$BUNDLE"
          codesign --force --sign - "$CLI"
          mkdir -p dist/OpenPedal
          cp -R "$BUNDLE" dist/OpenPedal/
          cp "$CLI" dist/OpenPedal/
          cp -R pedals boards docs/PEDAL_FORMAT.md docs/BOARD_FORMAT.md dist/OpenPedal/
          cat > dist/OpenPedal/INSTALL.txt <<'TXT'
          OpenPedal for macOS (VST3, universal: Apple Silicon + Intel)

          1. Copy OpenPedal.vst3 to ~/Library/Audio/Plug-Ins/VST3/
          2. This build is not notarized. Clear the quarantine flag once, then rescan in your DAW:
               xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/OpenPedal.vst3
          3. Example pedals are copied to ~/Music/OpenPedal/pedals on first run.

          open-pedal-render is the command-line renderer and pedal validator:
               ./open-pedal-render --check pedals/examples/*.json
          TXT
          (cd dist && ditto -c -k --keepParent OpenPedal "OpenPedal-${{ steps.version.outputs.version }}-macOS.zip")
          ls -la dist

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          BUNDLE=build/release/src/plugin/OpenPedal_artefacts/Release/VST3/OpenPedal.vst3
          CLI=build/release/src/cli/open-pedal-render_artefacts/Release/open-pedal-render
          mkdir -p dist/OpenPedal
          cp -R "$BUNDLE" dist/OpenPedal/
          cp "$CLI" dist/OpenPedal/
          cp -R pedals boards docs/PEDAL_FORMAT.md docs/BOARD_FORMAT.md dist/OpenPedal/
          cat > dist/OpenPedal/INSTALL.txt <<'TXT'
          OpenPedal for Linux (VST3, x86_64)

          1. Copy OpenPedal.vst3 to ~/.vst3/
          2. Rescan plugins in your DAW.
          3. Example pedals are copied to ~/.local/share/open-pedal/pedals on first run.
          TXT
          (cd dist && tar czf "OpenPedal-${{ steps.version.outputs.version }}-Linux-x86_64.tar.gz" OpenPedal)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: OpenPedal-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ls -la artifacts
          NOTES=$(cat <<'MD'
          ## Install

          **macOS** (universal, VST3): unzip, copy `OpenPedal.vst3` to `~/Library/Audio/Plug-Ins/VST3/`, then clear the quarantine flag once because this build is not notarized:

          ```sh
          xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/OpenPedal.vst3
          ```

          **Linux** (x86_64, VST3): extract and copy `OpenPedal.vst3` to `~/.vst3/`.

          Rescan plugins in your DAW. Example pedals are written to your pedals folder on first run; see `PEDAL_FORMAT.md` in the archive to write your own.
          MD
          )
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --title "OpenPedal ${GITHUB_REF_NAME}" \
            --notes "$NOTES" \
            --generate-notes
